# Ingress-only reverse proxy for the `proxy` Compose service.
#
# This container is the sole host-network member (`ingress`, a plain bridge network)
# and is also attached to the `internal` (internal: true) network so it can reach
# `web`/`mailpit` by service name. It proxies bytes only — it does not mount the
# application, load WordPress code, or grant `web`/`mailpit` any outbound access.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    server {
        listen 80;

        location / {
            proxy_pass http://web:80;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }

    server {
        listen 8025;

        location / {
            proxy_pass http://mailpit:8025;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
