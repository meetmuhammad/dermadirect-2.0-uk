; Local development overrides only — do not use these settings in production.
upload_max_filesize = 256M
post_max_size = 256M
memory_limit = 512M
max_execution_time = 300
max_input_vars = 5000
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
