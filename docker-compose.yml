name: dermadirect20uk

# Runtime services (web, db, wpcli, mailpit) sit on the `internal` network, which has
# `internal: true` set below — Docker refuses to route any traffic from it to the outside
# world. Dependency installers (`composer`, `node`) run only on-demand via the `deps` profile
# on a separate bridge network that has no route to the runtime services, so a package install
# can reach the internet but can never reach the imported database or the web container.
#
# `proxy` (nginx) is the one exception: it also joins `ingress`, a plain non-internal bridge
# network, solely so it can publish 127.0.0.1:8088/127.0.0.1:18025 on the host and relay them
# to web:80/mailpit:8025 over `internal`. It carries no application code and grants
# web/db/mailpit/wpcli no outbound access — see the `proxy` service below.
#
# Normal `docker compose up` only ever starts the internal-network services (plus `proxy`) —
# no egress is possible during day-to-day use. Egress only happens when you explicitly invoke a
# `deps` profile command (see scripts/theme-build.sh and `docker compose run --rm composer ...`).

services:
  web:
    build:
      context: ./docker/php
    depends_on:
      db:
        condition: service_healthy
    environment:
      - WP_ENV=${WP_ENV:-development}
      - WP_HOME=${WP_HOME:-http://localhost:8080}
      - WP_SITEURL=${WP_SITEURL:-http://localhost:8080/wp}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PREFIX=${DB_PREFIX:-wp_}
      - AUTH_KEY=${AUTH_KEY}
      - SECURE_AUTH_KEY=${SECURE_AUTH_KEY}
      - LOGGED_IN_KEY=${LOGGED_IN_KEY}
      - NONCE_KEY=${NONCE_KEY}
      - AUTH_SALT=${AUTH_SALT}
      - SECURE_AUTH_SALT=${SECURE_AUTH_SALT}
      - LOGGED_IN_SALT=${LOGGED_IN_SALT}
      - NONCE_SALT=${NONCE_SALT}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_FROM=${SMTP_FROM:-local@dermadirect.test}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-DermaDirect Local}
      - DISABLE_WP_CRON=${DISABLE_WP_CRON:-true}
      - ACTION_SCHEDULER_DISABLE_CLOCK=${ACTION_SCHEDULER_DISABLE_CLOCK:-true}
      - BLOCK_EXTERNAL_HTTP=${BLOCK_EXTERNAL_HTTP:-true}
    volumes:
      - .:/var/www/html
    networks:
      - internal
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/local.cnf:ro
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    networks:
      - internal
    restart: unless-stopped

  # Ingress-only reverse proxy: the `internal` network has no gateway, so it cannot
  # actually publish host ports (see README "Reaching the site"). This nginx service
  # is the only container that spans both `ingress` (a plain, non-internal bridge
  # network) and `internal`, and exists purely to relay 127.0.0.1:8088 -> web:80 and
  # 127.0.0.1:18025 -> mailpit:8025. It mounts only its own config (docker/nginx/nginx.conf),
  # never the application, and grants web/db/mailpit/wpcli no outbound access — they
  # remain internal-only.
  proxy:
    image: nginx:alpine
    depends_on:
      - web
      - mailpit
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
      - "127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025"
    networks:
      - ingress
      - internal
    restart: unless-stopped

  wpcli:
    image: wordpress:cli
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - WP_ENV=${WP_ENV:-development}
      - WP_HOME=${WP_HOME:-http://localhost:8080}
      - WP_SITEURL=${WP_SITEURL:-http://localhost:8080/wp}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PREFIX=${DB_PREFIX:-wp_}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_FROM=${SMTP_FROM:-local@dermadirect.test}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-DermaDirect Local}
      - DISABLE_WP_CRON=${DISABLE_WP_CRON:-true}
      - ACTION_SCHEDULER_DISABLE_CLOCK=${ACTION_SCHEDULER_DISABLE_CLOCK:-true}
      - BLOCK_EXTERNAL_HTTP=${BLOCK_EXTERNAL_HTTP:-true}
      # Persistent PHP memory override for the wpcli container only (web's php.ini is untouched).
      # WP_CLI_PHP_ARGS is read by the `wp` wrapper script in the wordpress:cli image and passed
      # straight to the underlying `php` binary as `-d` flags, so this applies to every `wp ...`
      # invocation of this service without needing a custom Dockerfile/php.ini mount.
      - WP_CLI_PHP_ARGS=-d memory_limit=1G
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    networks:
      - internal
    entrypoint: ["wp"]
    command: ["--info"]

  # `deps` profile: only started explicitly (docker compose --profile deps run --rm ...).
  # These have internet access but no path to db/web/mailpit.
  composer:
    image: composer:2
    profiles: ["deps"]
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - deps
    entrypoint: ["composer"]

  node:
    image: node:20-alpine
    profiles: ["deps"]
    working_dir: /var/www/html/${THEME_PATH:-web/app/themes/derma-direct}
    volumes:
      - .:/var/www/html
    networks:
      - deps

networks:
  internal:
    internal: true
  # Non-internal bridge network used only by the `proxy` service to publish
  # 127.0.0.1:8088/127.0.0.1:18025 on the host. It has no route to `deps` and is not
  # joined by web/db/mailpit/wpcli, so they remain reachable only via `internal`.
  ingress:
    driver: bridge
  deps:
    driver: bridge

volumes:
  db_data:
